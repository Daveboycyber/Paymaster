name: keeper

# Refreshes the WIF/ETH rate and flushes fees every 30 minutes.
# Setup: repo variables RATE_PROVIDER, PAYMASTER (and optionally RPC_URL),
# repo secret KEEPER_PRIVATE_KEY (the address set with BoundedRateProvider.setKeeper, holding a little ETH).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency: keeper

jobs:
  keep:
    if: ${{ vars.RATE_PROVIDER != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: keeper/package-lock.json
      - run: npm ci
      - run: npm start
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          RATE_PROVIDER: ${{ vars.RATE_PROVIDER }}
          PAYMASTER: ${{ vars.PAYMASTER }}
          RPC_URL: ${{ vars.RPC_URL }}
